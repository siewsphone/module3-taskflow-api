version: 2.1

# ---------------------------------------------------------------------------
# TaskFlow API — Module 4 stretch goal, OPTION 1: CI pipeline
#
#   build (+ smoke test)  ->  publish image to Docker Hub  ->  ask Railway to pull it
#
# Runs on every push to any branch, so a broken change is caught before it
# reaches main. `publish` and `deploy` only run for main, after `build` passes,
# so a failing change can never reach the registry or the deployment.
#
# CREDENTIALS
# -----------
# Nothing secret is stored in this file. These must be set in
# CircleCI -> Project Settings -> Environment Variables (or in a context):
#
#   DOCKER_USERNAME        Docker Hub account name        (context: docker-hub)
#   DOCKER_TOKEN           Docker Hub access token, Read & Write scope
#   RAILWAY_TOKEN          Railway project token          (deploy job only)
#   RAILWAY_SERVICE_ID     Railway service id             (deploy job only)
#
# The deploy job halts successfully, with an explanation, when the two Railway
# variables are absent — so the pipeline stays green and the published image is
# shipped from the Railway dashboard instead of failing on a credential it was
# never given.
# ---------------------------------------------------------------------------

jobs:

  # -------------------------------------------------------------------------
  # Build and test. The project has no JUnit classes, so `mvn package` passes
  # vacuously; the real test is the smoke sweep at the end of this job, which
  # boots the packaged JAR and asserts every endpoint's status code.
  # -------------------------------------------------------------------------
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Build and package (test phase included)
          command: mvn -B clean package
      - run:
          name: Smoke-test the packaged JAR
          command: |
            set -u
            BASE=http://localhost:8080
            CT='Content-Type: application/json'
            BODY=/tmp/smoke_body
            fail=0

            check() { # expected actual label
              if [ "$2" = "$1" ]; then
                printf 'PASS  %-26s -> %s\n' "$3" "$2"
              else
                printf 'FAIL  %-26s -> %s (expected %s)\n' "$3" "$2" "$1"
                fail=1
              fi
            }
            code() { curl -s -o "$BODY" -w '%{http_code}' "$@"; }

            echo "Starting the packaged application..."
            java -jar target/*.jar > app.log 2>&1 &
            APP_PID=$!
            trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

            up=0
            for i in $(seq 1 90); do
              if curl -fsS -o /dev/null "$BASE/api/tasks"; then
                echo "Application accepting requests after ${i}s"
                up=1
                break
              fi
              sleep 1
            done
            if [ "$up" -ne 1 ]; then
              echo "Application never became ready; last 50 log lines:"
              tail -50 app.log
              exit 1
            fi

            # Start from an empty store so ids and counts are deterministic.
            for id in $(curl -s "$BASE/api/tasks" | grep -o '"id":[0-9]*' | cut -d: -f2); do
              curl -s -o /dev/null -X DELETE "$BASE/api/tasks/$id"
            done

            check 200 "$(code "$BASE/api/tasks")"                   "GET /tasks"
            check 404 "$(code "$BASE/api/tasks/999999")"            "GET /tasks/999999"
            check 201 "$(code -X POST "$BASE/api/tasks" -H "$CT" \
                          -d '{"title":"Smoke test task","completed":false}')" "POST /tasks"

            ID=$(grep -o '"id":[0-9]*' "$BODY" | cut -d: -f2)
            echo "POST created id ${ID:-<none>}"
            if [ -z "${ID:-}" ]; then
              echo "FAIL  POST response carried no id"
              fail=1
              ID=1
            fi

            check 200 "$(code -X PUT "$BASE/api/tasks/$ID" -H "$CT" \
                          -d '{"title":"Smoke test renamed","completed":false}')" "PUT /tasks/{id}"
            check 200 "$(code -X PUT "$BASE/api/tasks/$ID/complete" -H "$CT")"  "PUT /tasks/{id}/complete"
            check 200 "$(code "$BASE/api/tasks/$ID")"               "GET /tasks/{id}"
            check 200 "$(code -X DELETE "$BASE/api/tasks/$ID")"     "DELETE /tasks/{id}"
            check 404 "$(code "$BASE/api/tasks/$ID")"               "GET /tasks/{id} (after)"
            # Nothing is left in the store here, so /summary short-circuits
            # before it reaches the model and needs no API key.
            check 200 "$(code "$BASE/api/tasks/summary")"          "GET /tasks/summary"
            # Option 4: the JAR must report the version the POM declares, so a
            # running container can prove which image tag it came from.
            EXPECTED_VERSION=$(awk '/<\/parent>/{f=1} f && /<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml)
            EXPECTED_VERSION="${EXPECTED_VERSION%-SNAPSHOT}"
            check 200 "$(code "$BASE/api/tasks/version")"          "GET /tasks/version"
            ACTUAL_VERSION=$(curl -s "$BASE/api/tasks/version" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
            if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "PASS  /tasks/version reports $ACTUAL_VERSION"
            else
              echo "FAIL  /tasks/version reports '${ACTUAL_VERSION:-<none>}', pom says '$EXPECTED_VERSION'"
              fail=1
            fi

            echo "---"
            if [ "$fail" -ne 0 ]; then
              echo "SMOKE TEST FAILED"
              exit 1
            fi
            echo "SMOKE TEST PASSED"
      - store_artifacts:
          path: app.log
          when: on_fail
      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}
      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar


  # ==========================================
  # PUBLISH JOB - Build and push Docker image
  # ==========================================
  # Three tags per build:
  #
  #   latest      what the Railway service tracks
  #   <semver>    MAJOR.MINOR.PATCH, read from pom.xml (SemVer, Lesson 4.5)
  #   sha-<7>     short commit SHA, so every image is traceable to its commit
  #
  # Bump the version in pom.xml to publish a new numbered release; the tag is
  # derived from the POM, never typed by hand, so an image can't claim a version
  # the code does not declare.
  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            IMAGE="$DOCKER_USERNAME/taskflow-api"
            # first <version> after </parent> is the project version, not the parent's
            VERSION=$(awk '/<\/parent>/{f=1} f && /<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml)
            VERSION="${VERSION%-SNAPSHOT}"
            SHA_TAG="sha-${CIRCLE_SHA1:0:7}"
            if [ -z "$VERSION" ]; then echo "Could not read the version from pom.xml"; exit 1; fi
            echo "Publishing $IMAGE:latest, $IMAGE:$VERSION, $IMAGE:$SHA_TAG"
            docker build -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:$SHA_TAG" .
      - run:
          name: Push to Docker Hub
          command: |
            IMAGE="$DOCKER_USERNAME/taskflow-api"
            VERSION=$(awk '/<\/parent>/{f=1} f && /<version>/{gsub(/.*<version>|<\/version>.*/,""); print; exit}' pom.xml)
            VERSION="${VERSION%-SNAPSHOT}"
            SHA_TAG="sha-${CIRCLE_SHA1:0:7}"
            echo "Logging in to Docker Hub..."
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:$SHA_TAG"
            docker push "$IMAGE:latest"
            echo "Pushed $IMAGE:$VERSION, $IMAGE:$SHA_TAG and $IMAGE:latest"


  # ==========================================
  # DEPLOY JOB - Tell Railway to redeploy
  # ==========================================
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Check for Railway credentials
          command: |
            if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
              echo "RAILWAY_TOKEN / RAILWAY_SERVICE_ID are not configured for this project."
              echo "The image above is published to Docker Hub; ship it with one click:"
              echo "  Railway dashboard -> service -> Deploys -> Redeploy latest image"
              circleci-agent step halt
            fi
      - run:
          name: Install the Railway CLI
          command: |
            # The npm package fetches its real binary in a postinstall script,
            # which CI's script policy skips — that is why `npx @railway/cli`
            # cannot work here. Railway's own installer drops the binary, but it
            # prompts "Install railway to ~/.railway/bin? [y/N]" and exits 1 on a
            # non-interactive stdin, so it must be given --yes.
            curl -fsSL cli.new | bash -s -- --yes
            export PATH="$HOME/.railway/bin:$PATH"
            railway --version
      - run:
          name: Redeploy the published image
          command: |
            # Each step is a fresh shell, so the CLI's install path must be
            # re-exported here.
            export PATH="$HOME/.railway/bin:$PATH"
            railway redeploy --service "$RAILWAY_SERVICE_ID" --yes
            echo "Railway is pulling $DOCKER_USERNAME/taskflow-api:latest from Docker Hub."

  # ==========================================
  # SECRETS JOB - fail the build if a credential is committed
  # ==========================================
  # Option 5 asks for "no passwords, tokens or other secrets committed". That is
  # not something to assert in a README; it needs a check that can fail. gitleaks
  # scans the full git history, not just the working tree, because a secret that
  # was committed once is leaked forever - deleting the file does not remove it
  # from history. --redact keeps any finding out of the build log.
  secrets:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            curl -sSL -o gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
            tar -xzf gitleaks.tar.gz gitleaks
            sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
            gitleaks version
      - run:
          name: Scan git history for committed secrets
          command: |
            gitleaks detect --source . --redact --verbose
            echo "No committed secrets found."

  # ==========================================
  # DEPENDENCY SCAN JOB - OWASP dependency-check
  # ==========================================
  # Runs the same Maven profile documented in the README (Option 5). Without an
  # NVD API key the feed sync is rate-limited to the point of timing out, so the
  # job halts successfully and prints what to configure - the same pattern the
  # deploy job uses for missing Railway credentials. A missing key reads as "not
  # configured", not as a vulnerability.
  dependency-scan:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Check for an NVD API key
          command: |
            if [ -z "${NVD_API_KEY:-}" ]; then
              echo "NVD_API_KEY is not configured, so the NVD feed cannot be synced"
              echo "within CI's time budget. Reproduce the scan locally with:"
              echo "  ./mvnw verify -Psecurity -DnvdApiKey=<your key>"
              echo "Free key: https://nvd.nist.gov/developers/request-an-api-key"
              circleci-agent step halt
            fi
      - run:
          name: Run OWASP dependency-check
          command: |
            mvn -B -Psecurity verify -DnvdApiKey="$NVD_API_KEY" -DskipTests
          no_output_timeout: 30m
      - store_artifacts:
          path: target/dependency-check-report.html
          destination: dependency-check-report.html

workflows:
  build-test-publish:
    jobs:
      - build
      - secrets
      - dependency-scan
      - publish:
          context: docker-hub
          requires:
            - build
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - publish
          filters:
            branches:
              only: main
