version: 2.1

# ---------------------------------------------------------------------------
# TaskFlow API — Module 4 stretch goal, OPTION 1: CI pipeline
#
#   build  ->  test  ->  publish the image to Docker Hub, on every push to main
#
# This runs alongside the existing deployment pipeline: Railway watches main and
# redeploys, while this pipeline produces a versioned image in Docker Hub.
#
# CREDENTIALS
# -----------
# Nothing secret is stored in this file. Two variables must be set in
# CircleCI -> Project Settings -> Environment Variables:
#
#   DOCKER_USERNAME   your Docker Hub account name
#   DOCKER_TOKEN      a Docker Hub *access token* with Read & Write scope
#                        (create at hub.docker.com -> Account Settings ->
#                         Personal access tokens). Do NOT use your password.
#
# They can also come from a CircleCI Context if you prefer, in which case add
# `context: dockerhub` to the publish job below.
# ---------------------------------------------------------------------------

jobs:

  # -------------------------------------------------------------------------
  # Build and test. Runs on every branch and every pull request, so a broken
  # change is caught before it reaches main.
  # -------------------------------------------------------------------------
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Install dependencies and build
          command: |
            echo "Building the application..."
            mvn clean install -DskipTests
      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}
      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar


  # ==========================================
  # PUBLISH JOB - Build and push Docker image
  # ==========================================
  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            echo "Building Docker image..."
            docker build -t $DOCKER_USERNAME/taskflow-api:latest .
      - run:
          name: Push to Docker Hub
          command: |
            echo "Logging in to Docker Hub..."
            echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin
            echo "Pushing image to Docker Hub..."
            docker push $DOCKER_USERNAME/taskflow-api:latest

  # ==========================================
  # DEPLOY JOB - Tell Railway to redeploy
  # ==========================================
  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: Redeploy latest image on Railway
          command: |
            echo "Asking Railway to redeploy the latest image..."
            npx --yes @railway/cli redeploy --service "$RAILWAY_SERVICE_ID" --yes
            echo "Railway is now pulling $DOCKER_USERNAME/taskflow-api:latest from Docker Hub."


workflows:
  build-publish:
    jobs:
      - build
      - publish:
          context: docker-hub
      - deploy:
          requires:
            - publish

